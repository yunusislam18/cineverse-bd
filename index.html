<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineVerse BD | Movie Library</title>
<meta name="description" content="Browse movies, trailers, and official viewing links at CineVerse BD.">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f5f5;font-family:Arial, sans-serif}
header{position:sticky;top:0;background:#11151d;border-bottom:1px solid #252b36;padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;z-index:5}
.brand{font-size:22px;font-weight:800;letter-spacing:1px}.brand span{color:#e50945}
nav a{color:#ddd;text-decoration:none;margin-left:16px;font-size:14px}
main{max-width:1150px;margin:auto;padding:24px 5%}
.hero{background:linear-gradient(120deg,#231323,#182331);border-radius:16px;padding:28px 24px;margin:12px 0 24px}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{color:#c4c8d0;margin:0}
.searchrow{display:flex;gap:10px;margin:20px 0}
input,select{background:#171c25;color:#fff;border:1px solid #303846;border-radius:10px;padding:12px;font-size:15px}
input{flex:1;min-width:0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 14px}
.sectionhead h2{margin:0;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}
.card{background:#151922;border:1px solid #252c37;border-radius:12px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#e50945}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#252b35}
.info{padding:11px}.info h3{font-size:15px;margin:0 0 6px}.meta{color:#aab2bf;font-size:12px;margin-bottom:10px}
.btn{display:inline-block;background:#e50945;color:white;text-decoration:none;border-radius:7px;padding:9px 12px;font-size:13px;font-weight:bold}
.btn:hover{background:#bf0738}.empty{color:#aab2bf;text-align:center;padding:35px;display:none}
footer{text-align:center;color:#8b929f;padding:30px 5%;border-top:1px solid #252b36;margin-top:35px;font-size:13px}
@media(max-width:560px){header{padding:13px 4%}.brand{font-size:18px}nav a{margin-left:8px;font-size:12px}main{padding:18px 4%}.hero h1{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
</head>
<body>
<header>
  <div class="brand">CINE<span>VERSE</span> BD</div>
  <nav><a href="#home">Home</a><a href="#movies">Movies</a></nav>
</header>
<main id="home">
  <section class="hero">
    <h1>Discover Movies 🎬</h1>
    <p>Explore movie details, trailers, and authorized viewing links.</p>
  </section>
  <div class="searchrow">
    <input id="search" type="search" placeholder="মুভির নাম লিখে খুঁজুন..." aria-label="Search movies">
    <select id="genre" aria-label="Genre">
      <option value="">সব ক্যাটাগরি</option>
      <option>Action</option><option>Drama</option><option>Comedy</option><option>Epic</option><option>Romance</option>
    </select>
  </div>
  <section id="movies">
    <div class="sectionhead"><h2>Movie Library</h2><span id="count"></span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">কোনো মুভি পাওয়া যায়নি।</div>
  </section>
</main>
<footer>© <span id="year"></span> CineVerse BD · Movie information and authorized links</footer>
<script>
/* Add your movies here. Use poster image URLs and authorized viewing/trailer URLs. */
const movies = [
  {title:"Ramayana",year:"2026",genre:"Epic",poster:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=600&q=80",link:"https://www.youtube.com/"},
  {title:"Example Action Movie",year:"2025",genre:"Action",poster:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80",link:"https://www.youtube.com/"},
  {title:"Example Drama",year:"2024",genre:"Drama",poster:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",link:"https://www.youtube.com/"}
];
const grid=document.getElementById('grid'),search=document.getElementById('search'),genre=document.getElementById('genre');
function render(){
 const q=search.value.toLowerCase().trim(),g=genre.value;
 const filtered=movies.filter(m=>m.title.toLowerCase().includes(q)&&(!g||m.genre===g));
 grid.innerHTML=filtered.map(m=>`<article class="card"><img class="poster" src="${m.poster}" alt="${m.title} poster" loading="lazy"><div class="info"><h3>${m.title}</h3><div class="meta">${m.year} · ${m.genre}</div><a class="btn" href="${m.link}" target="_blank" rel="noopener">Watch / Trailer</a></div></article>`).join('');
 document.getElementById('count').textContent=filtered.length+' movies';
 document.getElementById('empty').style.display=filtered.length?'none':'block';
}
search.addEventListener('input',render);genre.addEventListener('change',render);
document.getElementById('year').textContent=new Date().getFullYear();render();
</script>
</body>
</html>
