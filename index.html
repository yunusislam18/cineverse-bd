<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CineVerse BD</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f5f5f5;font-family:Arial,sans-serif}header{background:#11151d;padding:16px 5%;border-bottom:1px solid #252b36}.brand{font-size:22px;font-weight:bold}.brand span{color:#e50945}main{max-width:1100px;margin:auto;padding:24px 5%}.hero{background:linear-gradient(120deg,#231323,#182331);padding:26px;border-radius:16px}.hero h1{margin-top:0}.searchrow{display:flex;gap:10px;margin:20px 0}input,select{background:#171c25;color:#fff;border:1px solid #303846;border-radius:10px;padding:12px}input{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.card{background:#151922;border:1px solid #252c37;border-radius:12px;overflow:hidden}.poster{width:100%;aspect-ratio:2/3;object-fit:cover}.info{padding:12px}.info h3{margin:0 0 7px}.meta{color:#aab2bf;font-size:12px;margin-bottom:12px}.btn{display:inline-block;background:#e50945;color:white;text-decoration:none;border-radius:7px;padding:9px 12px;font-size:13px;font-weight:bold}.empty{display:none;text-align:center;padding:30px;color:#aaa}footer{text-align:center;color:#8b929f;padding:30px}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="brand">CINE<span>VERSE</span> BD</div></header><main><section class="hero"><h1>Discover Movies 🎬</h1><p>Explore movie details, trailers, and authorized viewing links.</p></section><div class="searchrow"><input id="search" placeholder="মুভির নাম লিখে খুঁজুন..."><select id="genre"><option value="">সব ক্যাটাগরি</option><option>Action</option><option>Drama</option><option>Comedy</option><option>Epic</option><option>Romance</option></select></div><h2>Movie Library <small id="count"></small></h2><div class="grid" id="grid"></div><div class="empty" id="empty">কোনো মুভি পাওয়া যায়নি।</div></main><footer>© <span id="year"></span> CineVerse BD</footer><script>
const movies=[{title:"Ramayana",year:"2026",genre:"Epic",poster:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=600&q=80",link:"https://www.youtube.com/results?search_query=Ramayana+official+trailer"}];
const grid=document.getElementById('grid'),search=document.getElementById('search'),genre=document.getElementById('genre');
function render(){let q=search.value.toLowerCase().trim(),g=genre.value;let list=movies.filter(m=>m.title.toLowerCase().includes(q)&&(!g||m.genre===g));grid.innerHTML=list.map(m=>`<article class="card"><img class="poster" src="${m.poster}" alt="${m.title} poster"><div class="info"><h3>${m.title}</h3><div class="meta">${m.year} · ${m.genre}</div><a class="btn" href="${m.link}" target="_blank" rel="noopener">Watch / Trailer</a></div></article>`).join('');document.getElementById('count').textContent=list.length+' movies';document.getElementById('empty').style.display=list.length?'none':'block'}search.addEventListener('input',render);genre.addEventListener('change',render);document.getElementById('year').textContent=new Date().getFullYear();render();
</script></body></html>
